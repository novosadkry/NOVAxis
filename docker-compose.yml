services:
  novaxis:
    image: novosadkry/novaxis
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novaxis-discord
    tty: true
    stdin_open: true
    volumes:
      - ./NOVAxis/config.json:/app/config.json
      # Data-protection key ring - web sessions survive a restart with it
      - ./NOVAxis/keys:/app/keys
    ports:
      # The web player; TLS belongs to the reverse proxy in front
      - "5000:5000"
    restart: unless-stopped
    logging:
      options:
        max-size: 50m

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink
    container_name: novaxis-lavalink
    profiles:
      - lavalink
    volumes:
      - ./NOVAxis/Lavalink/application.yml:/opt/Lavalink/application.yml
      - ./NOVAxis/Lavalink/plugins:/opt/Lavalink/plugins
    expose:
      - 2333
    restart: unless-stopped
    logging:
      options:
        max-size: 50m
